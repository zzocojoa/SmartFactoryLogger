name: Signed Windows Release

run-name: Signed Windows release ${{ inputs.release_tag }} from protected default branch

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v<major>.<minor>.<patch> tag on this exact default-branch commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: signed-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-windows-release:
    name: Build signed Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    environment: production-signing

    defaults:
      run:
        shell: pwsh
        working-directory: v2_next

    env:
      PYTHONNOUSERSITE: "1"
      EXPECTED_BUILD_COMMIT: ${{ github.sha }}
      EXPECTED_SIGNER_SHA1: ${{ vars.WINDOWS_CODE_SIGNING_CERT_SHA1 }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify source and release identity
        run: |
          $actualCommit = (git rev-parse HEAD).Trim()
          if ($actualCommit -cne $env:EXPECTED_BUILD_COMMIT) {
            throw "Checkout commit mismatch: expected=$env:EXPECTED_BUILD_COMMIT actual=$actualCommit"
          }

          if (
            $env:GITHUB_REF_TYPE -cne "branch" -or
            $env:GITHUB_REF_NAME -cne $env:DEFAULT_BRANCH
          ) {
            throw "Signed workflow must run from the protected default branch."
          }

          if ($env:RELEASE_TAG -cnotmatch "^v\d+\.\d+\.\d+$") {
            throw "release_tag must use v<major>.<minor>.<patch>."
          }

          $packageVersion = (
            Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json
          ).version
          if ([string]::IsNullOrWhiteSpace($packageVersion)) {
            throw "package.json version is missing."
          }

          $expectedTag = "v$packageVersion"
          if ($env:RELEASE_TAG -cne $expectedTag) {
            throw "Release tag/version mismatch: expected=$expectedTag actual=$env:RELEASE_TAG"
          }

          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag does not exist: $env:RELEASE_TAG"
          }
          $tagCommit = (git rev-parse "refs/tags/$env:RELEASE_TAG^{commit}").Trim()
          if ($tagCommit -cne $actualCommit) {
            throw "Release tag must point to this exact protected default-branch commit: tag=$tagCommit commit=$actualCommit"
          }

          Write-Host "Signed release source verified: commit=$actualCommit tag=$env:RELEASE_TAG version=$packageVersion"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: |
            v2_next/package-lock.json
            v2_next/frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.6"

      - name: Install Electron dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: v2_next/frontend
        run: npm ci

      - name: Prepare backend validation environment
        run: |
          python -m venv backend\.venv
          .\backend\.venv\Scripts\python.exe -m pip install `
            --disable-pip-version-check `
            --require-virtualenv `
            --require-hashes `
            --only-binary=:all: `
            -r backend\requirements-windows-release.lock

      - name: Validate exact release source before packaging
        run: npm run health

      - name: Build portable package
        run: powershell -ExecutionPolicy Bypass -File scripts\deploy.ps1

      - name: Verify packaged source identity
        run: |
          $bundleRoot = "backend\dist\SmartFactoryBackend"
          $manifestPath = Join-Path $bundleRoot "bundle-manifest.json"
          $provenancePath = Join-Path $bundleRoot "_internal\backend\build_provenance.json"

          foreach ($path in @($manifestPath, $provenancePath)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Packaged identity file not found: $path"
            }
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $provenance = Get-Content -LiteralPath $provenancePath -Raw | ConvertFrom-Json
          Import-Module scripts\backend_bundle_integrity.psm1 -Force -ErrorAction Stop
          $integrity = Test-BackendBundleIntegrity -BackendRoot $bundleRoot
          if (-not $integrity.ok) {
            throw "Backend bundle integrity failed: $($integrity | ConvertTo-Json -Depth 6 -Compress)"
          }
          if ($manifest.build_git_commit -cne $env:EXPECTED_BUILD_COMMIT) {
            throw "Bundle manifest commit mismatch: expected=$env:EXPECTED_BUILD_COMMIT actual=$($manifest.build_git_commit)"
          }
          if ($provenance.git_commit -cne $env:EXPECTED_BUILD_COMMIT) {
            throw "Build provenance commit mismatch: expected=$env:EXPECTED_BUILD_COMMIT actual=$($provenance.git_commit)"
          }

      - name: Verify signature helper self-tests
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\verify_windows_release_signature.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) {
            throw "Signature verifier self-test failed: exit_code=$LASTEXITCODE"
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\verify_windows_release_workflow_contract.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) {
            throw "Release workflow contract test failed: exit_code=$LASTEXITCODE"
          }

      - name: Prepare ephemeral signing certificate
        id: signing
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            throw "production-signing secret WINDOWS_CODE_SIGNING_PFX_BASE64 is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw "production-signing secret WINDOWS_CODE_SIGNING_PFX_PASSWORD is not configured."
          }

          $expectedSigner = ($env:EXPECTED_SIGNER_SHA1 -replace "\s", "").ToUpperInvariant()
          if ($expectedSigner -cnotmatch "^[0-9A-F]{40}$") {
            throw "production-signing variable WINDOWS_CODE_SIGNING_CERT_SHA1 must be a 40-character SHA-1 thumbprint."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "smartfactorylogger-code-signing.pfx"
          try {
            $base64 = $env:SIGNING_PFX_BASE64 -replace "\s", ""
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($base64))
          } catch {
            throw "The production signing certificate secret is not valid base64 PKCS#12 data."
          }

          $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $pfxPath,
            $env:SIGNING_PFX_PASSWORD,
            $flags
          )
          try {
            if (-not $certificate.HasPrivateKey) {
              throw "The production signing certificate does not contain a private key."
            }
            if ($certificate.Thumbprint.ToUpperInvariant() -cne $expectedSigner) {
              throw "Production signing certificate thumbprint does not match WINDOWS_CODE_SIGNING_CERT_SHA1."
            }

            $now = Get-Date
            if ($certificate.NotBefore -gt $now -or $certificate.NotAfter -le $now) {
              throw "The production signing certificate is not currently valid."
            }

            $codeSigningOid = "1.3.6.1.5.5.7.3.3"
            $codeSigningAllowed = $false
            foreach ($extension in $certificate.Extensions) {
              if ($extension -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]) {
                foreach ($usage in $extension.EnhancedKeyUsages) {
                  if ($usage.Value -ceq $codeSigningOid) {
                    $codeSigningAllowed = $true
                  }
                }
              }
            }
            if (-not $codeSigningAllowed) {
              throw "The production signing certificate does not permit code signing."
            }
          } finally {
            $certificate.Dispose()
          }

          "pfx_path=$pfxPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Production signing certificate preflight passed: thumbprint=$expectedSigner"

      - name: Build Authenticode-signed NSIS installer
        env:
          WIN_CSC_LINK: ${{ steps.signing.outputs.pfx_path }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_PASSWORD }}
        run: npm run dist

      - name: Verify exact published installer payload
        run: |
          $packageVersion = (
            Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json
          ).version
          $installerPath = Join-Path "dist" "smart-factory-logger-v2 Setup $packageVersion.exe"
          $artifactDir = Join-Path $env:RUNNER_TEMP "smartfactorylogger-windows-signed"
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          $publishedInstallerPath = Join-Path $artifactDir ([IO.Path]::GetFileName($installerPath))
          Copy-Item -LiteralPath $installerPath -Destination $publishedInstallerPath -ErrorAction Stop

          $payloadRoot = Join-Path $env:RUNNER_TEMP (
            "smartfactorylogger-windows-extracted-{0}-{1}" -f
            $env:GITHUB_RUN_ID,
            $env:GITHUB_RUN_ATTEMPT
          )
          if (Test-Path -LiteralPath $payloadRoot) {
            throw "Isolated extraction directory already exists: $payloadRoot"
          }
          New-Item -ItemType Directory -Path $payloadRoot -ErrorAction Stop | Out-Null

          $sevenZipPath = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          if (-not (Test-Path -LiteralPath $sevenZipPath -PathType Leaf)) {
            throw "Required runner-owned 7-Zip executable was not found: $sevenZipPath"
          }
          $sevenZipOutput = (& $sevenZipPath x -y "-o$payloadRoot" $publishedInstallerPath 2>&1 | Out-String)
          $sevenZipExit = $LASTEXITCODE
          if ($sevenZipExit -notin @(0, 1)) {
            throw "Installer extraction failed: exit_code=$sevenZipExit`n$sevenZipOutput"
          }
          if (
            $sevenZipExit -eq 1 -and
            (
              $sevenZipOutput -notmatch "There are data after the end of archive" -or
              $sevenZipOutput -match "(?im)^ERROR:"
            )
          ) {
            throw "Installer extraction returned an unexpected warning.`n$sevenZipOutput"
          }

          $applicationPath = Join-Path $payloadRoot "smart-factory.exe"
          $manifestPath = Join-Path $payloadRoot "resources\backend\bundle-manifest.json"
          $provenancePath = Join-Path $payloadRoot "resources\backend\_internal\backend\build_provenance.json"
          $evidencePath = Join-Path $artifactDir "signed_release_identity.json"

          powershell.exe `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File "scripts\verify_windows_release_signature.ps1" `
            -InstallerPath $publishedInstallerPath `
            -AppExecutablePath $applicationPath `
            -BundleManifestPath $manifestPath `
            -BuildProvenancePath $provenancePath `
            -ExpectedBuildCommit $env:EXPECTED_BUILD_COMMIT `
            -ExpectedSignerSHA1 $env:EXPECTED_SIGNER_SHA1 `
            -EvidencePath $evidencePath
          if ($LASTEXITCODE -ne 0) {
            throw "Signed Windows release verification failed: exit_code=$LASTEXITCODE"
          }

      - name: Remove signing certificate and extracted payload
        if: always()
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "smartfactorylogger-code-signing.pfx"
          if (Test-Path -LiteralPath $pfxPath -PathType Leaf) {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction Stop
            if (Test-Path -LiteralPath $pfxPath) {
              throw "Ephemeral signing certificate cleanup failed."
            }
          }

          $payloadRoot = Join-Path $env:RUNNER_TEMP (
            "smartfactorylogger-windows-extracted-{0}-{1}" -f
            $env:GITHUB_RUN_ID,
            $env:GITHUB_RUN_ATTEMPT
          )
          $runnerTempRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd("\") + "\"
          $payloadFullPath = [IO.Path]::GetFullPath($payloadRoot)
          if (-not $payloadFullPath.StartsWith(
            $runnerTempRoot,
            [StringComparison]::OrdinalIgnoreCase
          )) {
            throw "Refusing to remove extraction path outside RUNNER_TEMP: $payloadFullPath"
          }
          if (Test-Path -LiteralPath $payloadFullPath -PathType Container) {
            Remove-Item -LiteralPath $payloadFullPath -Recurse -Force -ErrorAction Stop
          }
          if (Test-Path -LiteralPath $payloadFullPath) {
            throw "Extracted installer payload cleanup failed."
          }

      - name: Record signed release checksums
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP "smartfactorylogger-windows-signed"
          $evidencePath = Join-Path $artifactDir "signed_release_identity.json"
          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          if (-not $evidence.passed) {
            throw "Signed release evidence verdict is not passing."
          }
          $installerPath = Get-ChildItem -LiteralPath $artifactDir -Filter "*.exe" -File
          if (@($installerPath).Count -ne 1) {
            throw "Signed artifact directory must contain exactly one installer."
          }
          $finalInstallerSha256 = (
            Get-FileHash -Algorithm SHA256 -LiteralPath $installerPath.FullName
          ).Hash
          if ($finalInstallerSha256 -cne [string]$evidence.installer.sha256) {
            throw "Published installer changed after verification."
          }

          $checksumPath = Join-Path $artifactDir "SHA256SUMS.txt"
          Get-ChildItem -LiteralPath $artifactDir -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
              "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
            } |
            Set-Content -LiteralPath $checksumPath -Encoding ASCII
          Get-Content -LiteralPath $checksumPath

      - name: Upload signed Windows release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smartfactorylogger-windows-signed-${{ github.run_number }}
          path: ${{ runner.temp }}/smartfactorylogger-windows-signed/*
          if-no-files-found: error
          retention-days: 14
