name: Windows PR Artifact

on:
  pull_request:
    paths:
      - ".github/workflows/windows-release-artifact.yml"
      - ".github/workflows/windows-signed-release.yml"
      - "v2_next/package.json"
      - "v2_next/package-lock.json"
      - "v2_next/main.js"
      - "v2_next/scripts/deploy.ps1"
      - "v2_next/scripts/backend_bundle_integrity.psm1"
      - "v2_next/scripts/measure_nsis_operational_ready.ps1"
      - "v2_next/scripts/verify_windows_release_signature.ps1"
      - "v2_next/scripts/verify_windows_release_workflow_actions.cjs"
      - "v2_next/scripts/verify_windows_release_workflow_contract.ps1"
      - "v2_next/backend/**"
      - "v2_next/frontend/**"

permissions:
  contents: read

jobs:
  build-windows-artifacts:
    name: Build Windows artifacts
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh
        working-directory: v2_next

    env:
      PYTHONNOUSERSITE: "1"
      EXPECTED_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify source identity
        run: |
          $actualCommit = (git rev-parse HEAD).Trim()
          if ($actualCommit -ne $env:EXPECTED_BUILD_COMMIT) {
            throw "Checkout commit mismatch: expected=$env:EXPECTED_BUILD_COMMIT actual=$actualCommit"
          }
          Write-Host "Building source commit: $actualCommit"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: |
            v2_next/package-lock.json
            v2_next/frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.6"

      - name: Install Electron dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: v2_next/frontend
        run: npm ci

      - name: Prepare backend validation environment
        run: |
          python -m venv backend\.venv
          .\backend\.venv\Scripts\python.exe -m pip install `
            --disable-pip-version-check `
            --require-virtualenv `
            --require-hashes `
            --only-binary=:all: `
            -r backend\requirements-windows-release.lock

      - name: Validate backend before packaging
        run: |
          npm run health:backend:lint
          npm run health:backend:typecheck
          npm run health:backend:test

      - name: Validate Windows release gates
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\verify_windows_release_signature.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) {
            throw "Signature verifier self-test failed: exit_code=$LASTEXITCODE"
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\verify_windows_release_workflow_contract.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) {
            throw "Release workflow contract test failed: exit_code=$LASTEXITCODE"
          }

      - name: Build portable package
        run: powershell -ExecutionPolicy Bypass -File scripts\deploy.ps1

      - name: Verify packaged source identity
        run: |
          $bundleRoot = "backend\dist\SmartFactoryBackend"
          $manifestPath = Join-Path $bundleRoot "bundle-manifest.json"
          $provenancePath = Join-Path $bundleRoot "_internal\backend\build_provenance.json"

          foreach ($path in @($manifestPath, $provenancePath)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Packaged identity file not found: $path"
            }
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $provenance = Get-Content -LiteralPath $provenancePath -Raw | ConvertFrom-Json
          Import-Module .\scripts\backend_bundle_integrity.psm1 -Force -ErrorAction Stop
          $integrity = Test-BackendBundleIntegrity -BackendRoot $bundleRoot
          if (-not $integrity.ok) {
            throw "Backend bundle integrity failed: $($integrity | ConvertTo-Json -Depth 6 -Compress)"
          }

          if ($manifest.build_git_commit -ne $env:EXPECTED_BUILD_COMMIT) {
            throw "Bundle manifest commit mismatch: expected=$env:EXPECTED_BUILD_COMMIT actual=$($manifest.build_git_commit)"
          }
          if ($provenance.git_commit -ne $env:EXPECTED_BUILD_COMMIT) {
            throw "Build provenance commit mismatch: expected=$env:EXPECTED_BUILD_COMMIT actual=$($provenance.git_commit)"
          }

          Write-Host "Packaged source identity verified: $env:EXPECTED_BUILD_COMMIT"

      - name: Preserve portable artifact
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP "smartfactorylogger-windows"
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          $portableZip = Get-ChildItem -Path "dist" -Filter "SmartFactory_v*_Portable.zip" | Select-Object -First 1
          if (-not $portableZip) {
            throw "Portable ZIP was not generated."
          }

          Copy-Item -Path $portableZip.FullName -Destination $artifactDir -Force

      - name: Build NSIS installer
        run: npm run dist

      - name: Verify packaged application source identity
        run: |
          $bundleRoot = "dist\win-unpacked\resources\backend"
          $manifestPath = Join-Path $bundleRoot "bundle-manifest.json"
          $provenancePath = Join-Path $bundleRoot "_internal\backend\build_provenance.json"

          foreach ($path in @($manifestPath, $provenancePath)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Packaged application identity file not found: $path"
            }
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $provenance = Get-Content -LiteralPath $provenancePath -Raw | ConvertFrom-Json
          Import-Module .\scripts\backend_bundle_integrity.psm1 -Force -ErrorAction Stop
          $integrity = Test-BackendBundleIntegrity -BackendRoot $bundleRoot
          if (-not $integrity.ok) {
            throw "Packaged application bundle integrity failed: $($integrity | ConvertTo-Json -Depth 6 -Compress)"
          }
          if ($manifest.build_git_commit -cne $env:EXPECTED_BUILD_COMMIT) {
            throw "Packaged application manifest mismatch: expected=$env:EXPECTED_BUILD_COMMIT actual=$($manifest.build_git_commit)"
          }
          if ($provenance.git_commit -cne $env:EXPECTED_BUILD_COMMIT) {
            throw "Packaged application provenance mismatch: expected=$env:EXPECTED_BUILD_COMMIT actual=$($provenance.git_commit)"
          }

      - name: Preserve installer artifact
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP "smartfactorylogger-windows"
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          $installer = Get-ChildItem -Path "dist" -Filter "smart-factory-logger-v2 Setup *.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not generated."
          }

          Copy-Item -Path $installer.FullName -Destination $artifactDir -Force

      - name: Record checksums
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP "smartfactorylogger-windows"
          $checksumPath = Join-Path $artifactDir "SHA256SUMS.txt"

          Get-ChildItem -Path $artifactDir -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -Path $_.FullName
              "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
            } |
            Set-Content -Path $checksumPath -Encoding ASCII

          Get-Content -Path $checksumPath

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smartfactorylogger-windows-pr-unsigned-${{ github.run_number }}
          path: ${{ runner.temp }}/smartfactorylogger-windows/*
          if-no-files-found: error
          retention-days: 14
