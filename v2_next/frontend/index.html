<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        var bridge = window.smartFactoryElectron;
        if (!bridge || typeof bridge.recordStartupEvent !== "function") {
          return;
        }
        var payload = {
          document_ready_state: document.readyState,
          route: window.location.hash || window.location.pathname || "/",
          protocol: window.location.protocol
        };
        var rendererNowMs = null;
        function addTimingValue(key, value) {
          if (typeof value === "number" && isFinite(value)) {
            payload[key] = Math.round(value * 10) / 10;
          }
        }
        if (
          window.performance &&
          typeof window.performance.now === "function" &&
          typeof window.performance.timeOrigin === "number"
        ) {
          rendererNowMs = window.performance.now();
          payload.renderer_time_origin_ms = Math.round(window.performance.timeOrigin * 10) / 10;
          payload.renderer_now_ms = Math.round(rendererNowMs * 10) / 10;
          payload.renderer_epoch_ms = Math.round((window.performance.timeOrigin + rendererNowMs) * 10) / 10;
        }
        if (
          window.performance &&
          typeof window.performance.getEntriesByType === "function"
        ) {
          var navigationEntries = window.performance.getEntriesByType("navigation");
          var navigationEntry = navigationEntries && navigationEntries[0];
          if (navigationEntry) {
            payload.navigation_type = navigationEntry.type || null;
            addTimingValue("navigation_start_ms", navigationEntry.startTime);
            addTimingValue("navigation_fetch_start_ms", navigationEntry.fetchStart);
            addTimingValue("navigation_response_start_ms", navigationEntry.responseStart);
            addTimingValue("navigation_response_end_ms", navigationEntry.responseEnd);
            addTimingValue("navigation_dom_interactive_ms", navigationEntry.domInteractive);
            if (rendererNowMs !== null && typeof navigationEntry.responseEnd === "number") {
              addTimingValue(
                "navigation_response_end_to_inline_ms",
                rendererNowMs - navigationEntry.responseEnd
              );
            }
          }
        }
        var result = bridge.recordStartupEvent("renderer.index-html-inline-script", payload);
        if (result && typeof result.catch === "function") {
          result.catch(function () {});
        }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <style>
      #sfl-startup-overlay {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 18%, rgba(42, 114, 180, 0.22), transparent 42%),
          linear-gradient(145deg, #07111d 0%, #0c1c2c 52%, #07111d 100%);
        color: #f6f9fc;
        font-family: "Segoe UI", Arial, sans-serif;
        opacity: 1;
        transition: opacity 180ms ease-out;
      }
      #sfl-startup-overlay[hidden] { display: none; }
      #sfl-startup-overlay.is-complete { opacity: 0; pointer-events: none; }
      .sfl-startup-card {
        box-sizing: border-box;
        width: min(480px, calc(100vw - 48px));
        padding: 34px 38px 30px;
        border: 1px solid rgba(139, 194, 238, 0.2);
        border-radius: 22px;
        background: rgba(8, 22, 36, 0.86);
        box-shadow: 0 24px 72px rgba(0, 0, 0, 0.42);
        text-align: center;
      }
      .sfl-startup-image {
        width: 152px;
        height: 152px;
        border-radius: 28px;
        object-fit: cover;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.32);
      }
      .sfl-startup-title { margin: 24px 0 8px; font-size: 24px; font-weight: 700; }
      .sfl-startup-message { min-height: 24px; margin: 0; color: #bfd3e5; font-size: 16px; }
      .sfl-startup-progress {
        height: 8px;
        margin: 24px 0 10px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
      }
      .sfl-startup-progress-bar {
        width: 2%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #28a8ff, #56e0bd);
        transition: width 220ms ease-out;
      }
      .sfl-startup-meta { color: #7792aa; font-size: 16px; }
      .sfl-startup-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }
      .sfl-startup-actions[hidden] { display: none; }
      .sfl-startup-button {
        min-height: 44px;
        padding: 0 16px;
        border: 1px solid rgba(169, 207, 235, 0.28);
        border-radius: 9px;
        background: rgba(21, 51, 76, 0.9);
        color: #eef7ff;
        cursor: pointer;
        font: inherit;
      }
      .sfl-startup-button:hover { background: rgba(32, 72, 104, 0.96); }
      .sfl-startup-button:focus-visible { outline: 3px solid #8bd8ff; outline-offset: 3px; }
      .sfl-startup-button:disabled { cursor: wait; opacity: 0.55; }
      .sfl-startup-button.primary { border-color: #2ca7ee; background: #087bbd; }
      @media (prefers-reduced-motion: reduce) {
        #sfl-startup-overlay, .sfl-startup-progress-bar { transition: none; }
      }
    </style>
    <script>
      window.grafanaBootData = {
        settings: {
          timezone: "browser",
          buildInfo: {
            version: "1.0.0"
          },
          featureToggles: {}
        },
        user: {
          id: 1,
          isSignedIn: true,
          orgId: 1,
          orgName: "Main Org",
          locale: "en-US",
          isGrafanaAdmin: true,
          theme: "dark",
          localeFormatPreference: "browser"
        },
        navTree: []
      };
    </script>
    <title>창녕 2호기 Smart Factory</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="sfl-startup-overlay" role="dialog" aria-modal="true" aria-labelledby="sfl-startup-title">
      <section class="sfl-startup-card" id="sfl-startup-card" tabindex="-1">
        <img class="sfl-startup-image" src="./assets/splash.png" alt="Smart Factory Logger" />
        <h1 class="sfl-startup-title" id="sfl-startup-title">Smart Factory Logger 시작 중</h1>
        <p class="sfl-startup-message" id="sfl-startup-message" role="status" aria-live="polite">프로그램을 준비하고 있습니다.</p>
        <div
          class="sfl-startup-progress"
          id="sfl-startup-progress"
          role="progressbar"
          aria-label="프로그램 시작 진행률"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="2"
        >
          <div class="sfl-startup-progress-bar" id="sfl-startup-progress-bar"></div>
        </div>
        <div class="sfl-startup-meta" id="sfl-startup-meta">2% · 초기화</div>
        <div class="sfl-startup-actions" id="sfl-startup-actions" hidden>
          <button class="sfl-startup-button primary" id="sfl-startup-retry" type="button">다시 시도</button>
          <button class="sfl-startup-button" id="sfl-startup-offline" type="button">오프라인으로 열기</button>
          <button class="sfl-startup-button" id="sfl-startup-exit" type="button">종료</button>
        </div>
      </section>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var overlay = document.getElementById("sfl-startup-overlay");
        var root = document.getElementById("root");
        var bridge = window.smartFactoryElectron;
        if (root) root.inert = true;
        if (!overlay || !bridge || typeof bridge.getStartupState !== "function") {
          if (overlay) overlay.hidden = true;
          if (root) root.inert = false;
          return;
        }

        var card = document.getElementById("sfl-startup-card");
        var message = document.getElementById("sfl-startup-message");
        var progress = document.getElementById("sfl-startup-progress");
        var progressBar = document.getElementById("sfl-startup-progress-bar");
        var meta = document.getElementById("sfl-startup-meta");
        var actions = document.getElementById("sfl-startup-actions");
        var retryButton = document.getElementById("sfl-startup-retry");
        var offlineButton = document.getElementById("sfl-startup-offline");
        var exitButton = document.getElementById("sfl-startup-exit");
        var lastSequence = -1;
        var unsubscribe = null;
        var hideTimer = null;
        var actionsWereVisible = false;

        function setButtonsDisabled(disabled) {
          retryButton.disabled = disabled;
          offlineButton.disabled = disabled;
          exitButton.disabled = disabled;
        }

        function hideOverlay() {
          if (hideTimer !== null) return;
          hideTimer = -1;
          var beginFade = function () {
            overlay.classList.add("is-complete");
            hideTimer = window.setTimeout(function () {
              overlay.hidden = true;
              if (root) root.inert = false;
              if (typeof unsubscribe === "function") unsubscribe();
            }, 200);
          };
          if (typeof window.requestAnimationFrame === "function") {
            window.requestAnimationFrame(beginFade);
          } else {
            beginFade();
          }
        }

        function renderState(state) {
          if (!state || state.schema_version !== "electron-startup-state-v1") return;
          if (typeof state.sequence !== "number" || state.sequence < lastSequence) return;
          lastSequence = state.sequence;
          var value = Math.max(0, Math.min(100, Number(state.progress) || 0));
          message.textContent = state.message || "프로그램을 준비하고 있습니다.";
          progressBar.style.width = value + "%";
          progress.setAttribute("aria-valuenow", String(Math.round(value)));
          meta.textContent = Math.round(value) + "% · " + (state.phase || "초기화");
          var actionsVisible = Boolean(
            state.can_retry || state.can_continue_offline || state.can_exit
          );
          actions.hidden = !actionsVisible;
          retryButton.hidden = !state.can_retry;
          offlineButton.hidden = !state.can_continue_offline;
          exitButton.hidden = !state.can_exit;
          setButtonsDisabled(false);
          if (actionsVisible && !actionsWereVisible) {
            var firstAction = actions.querySelector("button:not([hidden])");
            if (firstAction) firstAction.focus();
          }
          actionsWereVisible = actionsVisible;
          if (state.status === "ready" || state.status === "degraded") hideOverlay();
        }

        function runAction(action) {
          if (typeof action !== "function") {
            message.textContent = "이 작업을 사용할 수 없습니다.";
            return;
          }
          setButtonsDisabled(true);
          Promise.resolve(action())
            .then(function (result) {
              if (!result || result.ok !== true) {
                message.textContent = "요청을 처리하지 못했습니다. 다시 시도하십시오.";
                setButtonsDisabled(false);
              }
            })
            .catch(function () {
              message.textContent = "요청을 처리하지 못했습니다. 다시 시도하십시오.";
              setButtonsDisabled(false);
            });
        }

        function reportSplashFirstPaint() {
          if (
            typeof window.requestAnimationFrame !== "function" ||
            typeof bridge.recordStartupEvent !== "function"
          ) return;
          window.requestAnimationFrame(function () {
            window.requestAnimationFrame(function () {
              Promise.resolve(bridge.recordStartupEvent("renderer.splash-first-paint", {
                ready_strategy: "double-raf",
                overlay_visible: !overlay.hidden
              })).catch(function () {});
            });
          });
        }

        retryButton.addEventListener("click", function () { runAction(bridge.retryStartup); });
        offlineButton.addEventListener("click", function () { runAction(bridge.continueStartupOffline); });
        exitButton.addEventListener("click", function () { runAction(bridge.exitStartup); });
        overlay.addEventListener("keydown", function (event) {
          if (event.key !== "Tab" || actions.hidden) return;
          var focusable = Array.prototype.slice.call(
            actions.querySelectorAll("button:not([hidden]):not([disabled])")
          );
          if (focusable.length === 0) return;
          var first = focusable[0];
          var last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        });

        if (card) card.focus();
        reportSplashFirstPaint();

        if (typeof bridge.onStartupStateChanged === "function") {
          unsubscribe = bridge.onStartupStateChanged(renderState);
        }
        Promise.resolve(bridge.getStartupState()).then(renderState).catch(function () {
          message.textContent = "시작 상태를 확인하고 있습니다.";
        });
      })();
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
