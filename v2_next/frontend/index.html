<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        var bridge = window.smartFactoryElectron;
        if (!bridge || typeof bridge.recordStartupEvent !== "function") {
          return;
        }
        var payload = {
          document_ready_state: document.readyState,
          route: window.location.hash || window.location.pathname || "/",
          protocol: window.location.protocol
        };
        var rendererNowMs = null;
        function addTimingValue(key, value) {
          if (typeof value === "number" && isFinite(value)) {
            payload[key] = Math.round(value * 10) / 10;
          }
        }
        if (
          window.performance &&
          typeof window.performance.now === "function" &&
          typeof window.performance.timeOrigin === "number"
        ) {
          rendererNowMs = window.performance.now();
          payload.renderer_time_origin_ms = Math.round(window.performance.timeOrigin * 10) / 10;
          payload.renderer_now_ms = Math.round(rendererNowMs * 10) / 10;
          payload.renderer_epoch_ms = Math.round((window.performance.timeOrigin + rendererNowMs) * 10) / 10;
        }
        if (
          window.performance &&
          typeof window.performance.getEntriesByType === "function"
        ) {
          var navigationEntries = window.performance.getEntriesByType("navigation");
          var navigationEntry = navigationEntries && navigationEntries[0];
          if (navigationEntry) {
            payload.navigation_type = navigationEntry.type || null;
            addTimingValue("navigation_start_ms", navigationEntry.startTime);
            addTimingValue("navigation_fetch_start_ms", navigationEntry.fetchStart);
            addTimingValue("navigation_response_start_ms", navigationEntry.responseStart);
            addTimingValue("navigation_response_end_ms", navigationEntry.responseEnd);
            addTimingValue("navigation_dom_interactive_ms", navigationEntry.domInteractive);
            if (rendererNowMs !== null && typeof navigationEntry.responseEnd === "number") {
              addTimingValue(
                "navigation_response_end_to_inline_ms",
                rendererNowMs - navigationEntry.responseEnd
              );
            }
          }
        }
        var result = bridge.recordStartupEvent("renderer.index-html-inline-script", payload);
        if (result && typeof result.catch === "function") {
          result.catch(function () {});
        }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <script>
      window.grafanaBootData = {
        settings: {
          timezone: "browser",
          buildInfo: {
            version: "1.0.0"
          },
          featureToggles: {}
        },
        user: {
          id: 1,
          isSignedIn: true,
          orgId: 1,
          orgName: "Main Org",
          locale: "en-US",
          isGrafanaAdmin: true,
          theme: "dark",
          localeFormatPreference: "browser"
        },
        navTree: []
      };
    </script>
    <title>창녕 2호기 Smart Factory</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
